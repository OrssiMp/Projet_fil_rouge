name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Déclenche le déploiement à chaque push sur la branche main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/node-versions@v4
        with:
          node-version: 20 # Ajustez selon votre version de Node

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build # Génère le dossier dist

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Vite génère un dossier 'dist'. (Si Vue CLI, vérifiez si c'est 'dist' ou 'build')

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4